<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel EPP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#f4f6f9; --card:#fff; --tx:#1c2430; --mut:#6b7684; --ac:#1f6feb; --mal:#d63b3b; --bd:#dde3ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161c; --card:#1b212a; --tx:#e8edf3; --mut:#93a0af; --bd:#2c3542; } }
  * { box-sizing:border-box; }
  body { margin:0; font:15px system-ui,sans-serif; background:var(--bg); color:var(--tx); }
  main { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; } h2 { font-size:1.05rem; margin:0 0 8px; }
  .grid { display:grid; gap:12px; grid-template-columns:1fr; } @media (min-width:900px) { .grid { grid-template-columns:3fr 2fr; } }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:14px; }
  #mapa { height:380px; border-radius:8px; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--bd); }
  th { color:var(--mut); font-weight:600; }
  .wrap { overflow-x:auto; }
  .kpi { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .kpi div { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:10px 16px; }
  .kpi b { display:block; font-size:1.5rem; }
  img.mini { width:56px; border-radius:4px; cursor:pointer; }
  .mut { color:var(--mut); } a { color:var(--ac); }
</style>
</head>
<body>
<main>
  <h1>Panel de incumplimientos de EPP</h1>
  <div class="kpi" id="kpi"></div>
  <div class="grid">
    <div class="card"><h2>Mapa de eventos</h2><div id="mapa"></div><p class="mut" id="nota"></p></div>
    <div class="card"><h2>Por zona y hora</h2><div class="wrap"><table id="rep"></table></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>Eventos</h2><div class="wrap"><table id="tab"></table></div></div>
  <p class="mut"><a href="/">← Capturar foto o video</a></p>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const faltas = e => [e.falta_casco ? "casco" : "", e.falta_chaleco ? "chaleco" : ""].filter(Boolean).join(" y ");
async function cargar() {
  const { eventos, reporte } = await (await fetch("/api/eventos")).json();
  const conGps = eventos.filter(e => e.latitud != null);
  $("kpi").innerHTML = `<div><b>${eventos.length}</b>eventos</div><div><b>${eventos.filter(e => e.falta_casco).length}</b>sin casco</div>` +
    `<div><b>${eventos.filter(e => e.falta_chaleco).length}</b>sin chaleco</div><div><b>${conGps.length}</b>con ubicación</div>`;
  $("rep").innerHTML = "<tr><th>Zona</th><th>Hora</th><th>Eventos</th><th>Sin casco</th><th>Sin chaleco</th></tr>" +
    reporte.map(r => `<tr><td>${r.zona}</td><td>${r.hora}:00</td><td>${r.eventos}</td><td>${r.sin_casco}</td><td>${r.sin_chaleco}</td></tr>`).join("");
  $("tab").innerHTML = "<tr><th>#</th><th>Momento</th><th>Zona</th><th>Falta</th><th>Conf.</th><th>Ubicación</th><th>Origen</th><th>Foto</th></tr>" +
    eventos.map(e => `<tr><td>${e.id}</td><td>${e.momento.replace("T", " ")}</td><td>${e.zona}</td><td>${faltas(e)}</td><td>${(e.confianza * 100).toFixed(0)}%</td>` +
      `<td>${e.latitud != null ? `<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${e.latitud},${e.longitud}">${e.latitud.toFixed(5)}, ${e.longitud.toFixed(5)}</a>` : '<span class="mut">—</span>'}</td>` +
      `<td>${e.origen || "video"}</td><td><a target="_blank" href="${e.imagen}"><img class="mini" src="${e.imagen}"></a></td></tr>`).join("");
  if (typeof L === "undefined") { $("nota").textContent = "El mapa necesita internet (Leaflet y OpenStreetMap)."; return; }
  const m = L.map("mapa").setView(conGps.length ? [conGps[0].latitud, conGps[0].longitud] : [11.54, -72.91], conGps.length ? 16 : 11);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(m);
  conGps.forEach(e => L.circleMarker([e.latitud, e.longitud], { radius: 9, color: "#d63b3b", fillOpacity: .7 }).addTo(m)
    .bindPopup(`<b>#${e.id} · ${e.zona}</b><br>${e.momento.replace("T", " ")}<br>Falta: ${faltas(e)}<br><img src="${e.imagen}" width="160">`));
  if (!conGps.length) $("nota").textContent = "Aún no hay eventos con ubicación.";
}
cargar();
</script>
</body>
</html>
